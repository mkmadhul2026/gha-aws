name: AWS OIDC EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws-oidc-ec2:
    runs-on: ubuntu-latest

    container:
      image: mkmdockerhub/gha-aws:latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List files in the repository
        run: |
          pwd
          ls -la
          find . -name "requirements.txt"

      - name: Check Python
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::390844777938:role/gha-role
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Get EC2 Instance IDs
        run: |
            echo "=== AWS Identity ==="
            aws sts get-caller-identity

            echo "=== EC2 Instances in ap-south-1 ==="
            aws ec2 describe-instances \
            --region ap-south-1 \
            --query "Reservations[*].Instances[*].[InstanceId,State.Name,Tags[?Key=='Name']|[0].Value]" \
            --output text
      
      - name: Upload file to S3
        run: |
          echo "Uploading file to S3 bucket..."
          aws s3 cp ./README.md s3://mkm-gha-aws-test-bucket/README.md
          echo "File uploaded successfully."

      - name: List files in S3 bucket
        run: |
          echo "Listing files in S3 bucket..."
          aws s3 ls s3://mkm-gha-aws-test-bucket/