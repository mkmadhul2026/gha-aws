name: container
description: Run commands inside a Docker container
inputs:
  docker_image:
    description: 'Docker image to use for the container'
    required: true
    default: 'mkmdockerhub/gha-aws:latest'

runs:
  using: 'composite'
  steps:
    - name: Run commands inside the container
      shell: bash
      run: |
        echo "Running commands inside the container..."
        docker run --rm \
          -e AWS_ACCESS_KEY_ID \
          -e AWS_SECRET_ACCESS_KEY \
          -e AWS_SESSION_TOKEN \
          -e AWS_REGION \
          -e AWS_DEFAULT_REGION \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          ${{ inputs.docker_image }} \
          bash -c "aws --version && aws sts get-caller-identity"