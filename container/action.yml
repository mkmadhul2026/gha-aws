name: container
description: Run commands inside a Docker container
inputs:
  docker_image:
    description: 'Docker image to use for the container'
    required: true
    default: 'mkmdockerhub/gha-aws:latest'

  environment:
    description: 'Environment name (e.g., dev, int, prod)'
    required: true
    default: 'dev'

runs:
  using: 'composite'
  steps:
  
    - name: Run commands inside the container
      shell: bash
      run: |
        echo "Running commands inside the container..."
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -v ~/.aws:/root/.aws \
          -e AWS_ACCESS_KEY_ID \
          -e AWS_SECRET_ACCESS_KEY \
          -e AWS_SESSION_TOKEN \
          -e AWS_REGION \
          -e AWS_DEFAULT_REGION \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          ${{ inputs.docker_image }} 
          bash -c "aws --version && aws sts get-caller-identity && aws s3 ls s3://mkm-gha-aws-test-bucket/ && df -hT && ls -la"

    - name: print contents of ~/.aws/credentials inside the container
      shell: bash
      run: |
        echo "Contents of ~/.aws/credentials inside the container:"
        cat ~/.aws/credentials

    - name: exec commands inside the running container
      shell: bash
      run: |
        echo "Executing commands inside the running container..."
        docker exec -it $(docker ps -q --filter ancestor=${{ inputs.docker_image }}) \
          bash -c "aws --version && aws sts get-caller-identity && aws s3 ls s3://mkm-gha-aws-test-bucket/ && df -hT && ls -la"